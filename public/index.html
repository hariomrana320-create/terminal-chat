
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal Chat - Private Messaging</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101410;
      --panel: #191f1a;
      --panel-light: #222b23;
      --green: #36d399;
      --green-hover: #5ee6ae;
      --text: #e8f1e9;
      --muted: #a2b2a5;
      --border: #354638;
      --danger: #ffb4ab;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px 14px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 620px;
      margin: 24px auto;
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 16px 45px #00000035;
    }

    h1 {
      margin: 0 0 6px;
      color: var(--green);
      font-size: clamp(27px, 6vw, 35px);
      letter-spacing: -1px;
    }

    h2 {
      margin: 24px 0 12px;
      color: var(--green);
      font-size: 18px;
    }

    p { color: var(--muted); }
    strong { color: var(--text); }

    input, button {
      width: 100%;
      min-height: 46px;
      margin: 6px 0;
      padding: 12px 14px;
      border-radius: 11px;
      font: inherit;
    }

    input {
      border: 1px solid var(--border);
      background: #111712;
      color: var(--text);
      outline: none;
    }

    input::placeholder { color: #849487; }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px #36d39920;
    }

    button {
      border: 1px solid transparent;
      background: var(--green);
      color: #092016;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }

    button:hover { background: var(--green-hover); }
    button:active { transform: scale(.98); }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .row input { flex: 1; min-width: 0; }
    .row button { flex: 0 0 auto; width: auto; min-width: 82px; }

    .hidden { display: none !important; }

    .status {
      min-height: 20px;
      color: var(--green);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    #results { display: grid; gap: 7px; }

    #results button {
      width: 100%;
      margin: 0;
      text-align: left;
      background: var(--panel-light);
      color: var(--text);
      border-color: var(--border);
    }

    #results button:hover {
      border-color: var(--green);
      color: var(--green);
    }

    #messages {
      height: min(38vh, 330px);
      min-height: 180px;
      overflow-y: auto;
      overflow-wrap: anywhere;
      padding: 12px;
      margin: 12px 0;
      background: #111712;
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .message {
      width: fit-content;
      max-width: 92%;
      margin: 9px 0;
      padding: 9px 12px;
      border-radius: 12px;
      background: var(--panel-light);
      color: var(--text);
    }

    .mine {
      margin-left: auto;
      background: #173d2c;
      color: #b7f7d7;
    }

    .theirs {
      margin-right: auto;
      background: #252d26;
      color: var(--text);
    }

    #logoutBtn {
      width: auto;
      min-height: 38px;
      padding: 8px 14px;
      background: transparent;
      color: var(--green);
      border-color: var(--border);
    }

    #sendBtn { min-width: 76px; }

    @media (max-width: 480px) {
      body { padding: 8px; }
      .container {
        margin: 8px auto;
        padding: 17px;
        border-radius: 16px;
      }
      .row { gap: 7px; }
      .row button { min-width: 70px; padding: 10px; }
      #messages { height: 38vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Terminal Chat</h1>
    <p>Private messaging for registered users</p>

    <section id="auth">
      <h2>Sign Up / Login</h2>
      <input id="username" placeholder="Username (3-20 characters)" autocomplete="username">
      <input id="password" type="password" placeholder="Password (minimum 8 characters)" autocomplete="current-password">
      <div class="row">
        <button id="signupBtn">Sign Up</button>
        <button id="loginBtn">Login</button>
      </div>
      <p id="authStatus" class="status"></p>
    </section>

    <section id="chat" class="hidden">
      <p>Logged in as: <strong id="myName"></strong></p>
      <button id="logoutBtn">Logout</button>

      <h2>Find a User</h2>
      <input id="search" placeholder="Type username to search">
      <div id="results"></div>
      <p id="searchStatus" class="status"></p>

      <h2>Private Chat</h2>
      <p>Chatting with: <strong id="selectedUser">None selected</strong></p>
      <div id="messages" aria-live="polite"></div>
      <div class="row">
        <input id="messageInput" placeholder="Write a private message..." maxlength="1000">
        <button id="sendBtn">Send</button>
      </div>
      <p id="chatStatus" class="status"></p>
    </section>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    let socket = null;
    let selectedUsername = "";
    let currentUsername = "";

    function showStatus(id, message) {
      $(id).textContent = message;
    }

    async function api(url, options = {}) {
      const response = await fetch(url, {
        credentials: "same-origin",
        ...options,
        headers: {
          "Content-Type": "application/json",
          ...(options.headers || {})
        }
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Request failed.");
      }

      return data;
    }

    async function signupOrLogin(action) {
      const username = $("username").value.trim();
      const password = $("password").value;

      try {
        const data = await api("/" + action, {
          method: "POST",
          body: JSON.stringify({ username, password })
        });

        await enterChat(data.username);
      } catch (error) {
        showStatus("authStatus", error.message);
      }
    }

    async function enterChat(username) {
      $("auth").classList.add("hidden");
      $("chat").classList.remove("hidden");
      $("myName").textContent = username;
      currentUsername = username;
      showStatus("authStatus", "");

      if (socket) socket.disconnect();

      socket = io();

      socket.on("connect", () => {
        showStatus("chatStatus", "Connected. Select a user to start chatting.");
      });

      socket.on("connect_error", (error) => {
        showStatus("chatStatus", error.message || "Connection failed.");
      });

      socket.on("private message", (message) => {
        addMessage(message, false);
      });

      socket.on("private message sent", (message) => {
        addMessage(message, true);
      });

      socket.on("private message error", (message) => {
        showStatus("chatStatus", message);
      });
    }

    async function searchUsers() {
      const search = $("search").value.trim();
      $("results").replaceChildren();

      if (!search) {
        showStatus("searchStatus", "Type a username to search.");
        return;
      }

      try {
        const data = await api("/users?search=" + encodeURIComponent(search));
        if (data.users.length === 0) {
          showStatus("searchStatus", "No matching users found.");
          return;
        }

        showStatus("searchStatus", "Choose a user:");
        data.users.forEach((username) => {
          const button = document.createElement("button");
          button.textContent = username.username;
          button.addEventListener("click", () => selectUser(username.username));
          $("results").appendChild(button);
        });
      } catch (error) {
        showStatus("searchStatus", error.message);
      }
    }

    async function selectUser(username) {
      selectedUsername = username;
      $("selectedUser").textContent = username;
      $("messages").replaceChildren();
      showStatus("chatStatus", "Loading chat history...");
      $("messageInput").focus();

      try {
        const data = await api("/messages?with=" + encodeURIComponent(username));
        if (selectedUsername !== username) return;

        data.messages.forEach((message) => {
          addMessage(message, message.from === currentUsername);
        });

        showStatus("chatStatus", "Chat history loaded.");
      } catch (error) {
        showStatus("chatStatus", "Could not load history: " + error.message);
      }
    }

    function addMessage(message, mine) {
      if (
        message.from !== selectedUsername &&
        message.to !== selectedUsername
      ) {
        return;
      }

      const item = document.createElement("div");
      item.className = "message " + (mine ? "mine" : "theirs");

      const sender = document.createElement("strong");
      sender.textContent = mine ? "You: " : message.from + ": ";

      const text = document.createElement("span");
      text.textContent = message.text;

      item.append(sender, text);
      $("messages").appendChild(item);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    function sendMessage() {
      const text = $("messageInput").value.trim();

      if (!socket || !socket.connected) {
        showStatus("chatStatus", "Not connected. Please wait or login again.");
        return;
      }

      if (!selectedUsername) {
        showStatus("chatStatus", "First search and select a user.");
        return;
      }

      if (!text) return;

      socket.emit("private message", {
        to: selectedUsername,
        text
      });

      $("messageInput").value = "";
      showStatus("chatStatus", "Sending message...");
    }

    async function logout() {
      try {
        if (socket) socket.disconnect();
        await api("/logout", { method: "POST", body: "{}" });

        $("chat").classList.add("hidden");
        $("auth").classList.remove("hidden");
        $("password").value = "";
        $("messages").replaceChildren();
        $("results").replaceChildren();
        $("search").value = "";
        selectedUsername = "";
        $("selectedUser").textContent = "None selected";
        showStatus("authStatus", "Logged out.");
      } catch (error) {
        showStatus("chatStatus", error.message);
      }
    }

    $("signupBtn").addEventListener("click", () => signupOrLogin("signup"));
    $("loginBtn").addEventListener("click", () => signupOrLogin("login"));
    $("search").addEventListener("input", searchUsers);
    $("sendBtn").addEventListener("click", sendMessage);
    $("messageInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });
    $("logoutBtn").addEventListener("click", logout);

    api("/me")
      .then((data) => enterChat(data.username))
      .catch(() => {});
  </script>
</body>
</html>
